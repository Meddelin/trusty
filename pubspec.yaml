name: trusty
description: "Cross-platform GUI client for TrustTunnel VPN"
publish_to: "none"
version: 1.0.0+7
homepage: https://github.com/Meddelin/trusty
repository: https://github.com/Meddelin/trusty
issue_tracker: https://github.com/Meddelin/trusty/issues

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # UI Components
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Local Storage
  shared_preferences: ^2.3.3

  # Secure storage for credentials (Windows DPAPI / macOS Keychain)
  flutter_secure_storage: ^10.3.1

  # Path utilities
  path: ^1.9.1

  # System tray
  tray_manager: ^0.2.3

  # Window management
  window_manager: ^0.4.2

  # SSH client for remote server setup
  dartssh2: ^2.9.0

  # Native open-file dialog (custom routing lists from a local file)
  file_selector: ^1.0.3
  package_info_plus: ^10.2.1

  # FFI for Win32 GetShortPathNameW (ASCII paths so a Cyrillic install dir
  # doesn't break the CLI)
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/

  # Bundled rather than fetched at runtime: a VPN client has to render before it
  # has a network. Static instances cut from the Google Fonts variable sources
  # (OFL licences ship alongside them in assets/fonts/).
  fonts:
    # UI face.
    - family: Geologica
      fonts:
        - asset: assets/fonts/Geologica-Light.ttf
          weight: 300
        - asset: assets/fonts/Geologica-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geologica-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geologica-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geologica-Bold.ttf
          weight: 700
    # Values the user reads as data: hosts, addresses, ports, counts, logs.
    - family: ChivoMono
      fonts:
        - asset: assets/fonts/ChivoMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/ChivoMono-Medium.ttf
          weight: 500
    # Chivo Mono is Latin-only; this carries Cyrillic at the same advance width,
    # so a routing list holding кино.рф never reflows a column.
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
