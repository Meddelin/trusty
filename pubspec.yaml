name: trusty
description: "Cross-platform GUI client for TrustTunnel VPN"
publish_to: "none"
version: 0.3.3+4
homepage: https://github.com/Meddelin/trusty
repository: https://github.com/Meddelin/trusty
issue_tracker: https://github.com/Meddelin/trusty/issues

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # UI Components
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Local Storage
  shared_preferences: ^2.3.3

  # Secure storage for credentials (Windows DPAPI / macOS Keychain)
  flutter_secure_storage: ^9.2.2

  # Path utilities
  path: ^1.9.1

  # System tray
  tray_manager: ^0.2.3

  # Window management
  window_manager: ^0.4.2

  # SSH client for remote server setup
  dartssh2: ^2.9.0

  # FFI for Win32 GetShortPathNameW (ASCII paths so a Cyrillic install dir
  # doesn't break the CLI)
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
